# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      HAVE_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: &checkout_action actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 11
        uses: &setup_java_action actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          cache: &java_cache 'maven'
          java-version: &java_version '11'
          distribution: &java_distrib 'temurin'
      - name: Login to Docker Hub
        if: ${{ env.HAVE_DOCKERHUB_TOKEN == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Append branch name to version if 'push' did not happen on 'main' or a tag
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')}}
        run: |
          mvn versions:set -DremoveSnapshot
          mvn help:evaluate -N -Dexpression=project.version|grep -v '\['
          VERSION=$(mvn help:evaluate -N -Dexpression=project.version|grep -v '\[')
          mvn versions:set -DnewVersion=$VERSION-${GITHUB_REF##*/}
      - name: Test with Maven and Testcontainers
        run: mvn package
      - name: Upload Test Results
        uses: &upload_action actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: &test-results test-results
          path: |
            target/classes
            target/test-classes
            target/site/jacoco
            target/surefire-reports
      - name: Upload jars
        uses: *upload_action
        with:
          name: jars
          path: |
            target/*.jar
            !target/*-with-dependencies.jar

  analyze:
    needs: [ test ]
    runs-on: ubuntu-latest

    env:
      HAVE_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
      HAVE_SONAR_DETAILS: ${{ vars.SONAR_PROJECTKEY != '' && vars.SONAR_ORGANIZATION != '' }}

    steps:
      - name: Checkout
        uses: *checkout_action
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: *setup_java_action
        with:
          cache: *java_cache
          java-version: '21'
          distribution: *java_distrib
      - name: Download Test Results
        uses: &download_action actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: *test-results
          path: target
      - name: Cache SonarCloud packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Append branch name to version if 'push' did not happen on 'main' or a tag
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')}}
        run: |
          mvn versions:set -DremoveSnapshot
          mvn help:evaluate -N -Dexpression=project.version|grep -v '\['
          VERSION=$(mvn help:evaluate -N -Dexpression=project.version|grep -v '\[')
          mvn versions:set -DnewVersion=$VERSION-${GITHUB_REF##*/}
      - name: Sonar analysis
        if: ${{ env.HAVE_SONAR_TOKEN == 'true' && env.HAVE_SONAR_DETAILS == 'true' }}
        run: mvn sonar:sonar -Dsonar.host.url=$SONAR_URL -Dsonar.projectKey=$SONAR_PROJECTKEY -Dsonar.organization=$SONAR_ORGANIZATION
        env:
          SONAR_PROJECTKEY: ${{ vars.SONAR_PROJECTKEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_URL: ${{ vars.SONAR_URL }}
          GITHUB_TOKEN: ${{ github.token }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload to codecov after successful tests
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  deploy:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' ||  startsWith(github.ref, 'refs/tags/')) }}
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: *checkout_action
      - name: Set up JDK 11
        uses: *setup_java_action
        with:
          cache: *java_cache
          java-version: *java_version
          distribution: *java_distrib
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          gpg-private-key: ${{ secrets.GPG_KEY }} # Value of the GPG private key to import
          gpg-passphrase-env-var: GPG_PASSPHRASE # env variable for GPG private key passphrase
      - name: Download Test Results
        uses: *download_action
        with:
          name: *test-results
          path: target
      - name: Make sure to append 'SNAPSHOT' to version if 'push' happened on 'main'
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          mvn versions:set -DremoveSnapshot
          mvn help:evaluate -N -Dexpression=project.version|grep -v '\['
          VERSION=$(mvn help:evaluate -N -Dexpression=project.version|grep -v '\[')
          mvn versions:set -DnewVersion=$VERSION-SNAPSHOT
      - name: Publish to GitHub Packages Apache Maven
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
